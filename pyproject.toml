[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podpop"
version = "0.1.0"
description = "iPhone-style AirPods battery popup for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "comtypes>=1.2",
    "PySide6-Essentials>=6.7",
    "winrt-runtime>=2.0",
    "winrt-Windows.Devices.Enumeration>=2.0",
    "winrt-Windows.Media.Control>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.gui-scripts]
podpop = "podpop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

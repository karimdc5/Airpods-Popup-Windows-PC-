[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "podpop"
version = "0.2.0"
description = "iPhone-style AirPods battery popup for Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karim" }]
keywords = ["airpods", "bluetooth", "battery", "windows", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "comtypes>=1.2",
    "PySide6-Essentials>=6.7",
    "winrt-runtime>=2.0",
    "winrt-Windows.Devices.Bluetooth.Rfcomm>=2.0",
    "winrt-Windows.Devices.Enumeration>=2.0",
    "winrt-Windows.Media.Control>=2.0",
]

[project.urls]
Homepage = "https://github.com/karimdc5/Airpods-Popup-Windows-PC-"
Issues = "https://github.com/karimdc5/Airpods-Popup-Windows-PC-/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6", "pillow>=10", "numpy>=2"]

[project.gui-scripts]
podpop = "podpop.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
podpop = ["assets/turntable/*.png", "assets/model/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

# Push a tag like v0.1.0 and this builds PodPop.exe and attaches it to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\pip install -e ".[dev]"
      - name: Build
        run: .\scripts\build.ps1
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/PodPop.exe
          generate_release_notes: true
